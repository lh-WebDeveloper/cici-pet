<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌宠小屋</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #dashboard {
      width: 100%;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--surface, #ffffff);
      border-radius: var(--radius, 24px);
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .pet-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--background, #fff7ed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .pet-info h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text, #3a2a20);
      margin-bottom: 4px;
    }
    .pet-info p {
      font-size: 13px;
      color: var(--muted, #9a7b6a);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-item {
      background: var(--background, #fff7ed);
      border-radius: 16px;
      padding: 14px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text, #3a2a20);
    }
    .stat-value small {
      font-size: 12px;
      font-weight: normal;
      color: var(--muted, #9a7b6a);
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text, #3a2a20);
      margin-bottom: 12px;
    }
    .interactions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .interaction-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: var(--background, #fff7ed);
      color: var(--text, #3a2a20);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .interaction-btn:hover {
      background: var(--accent, #ffc987);
      transform: translateY(-1px);
    }
    .settings-group {
      margin-bottom: 16px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--background, #fff7ed);
    }
    .setting-item:last-child {
      border-bottom: none;
    }
    .setting-label {
      font-size: 14px;
      color: var(--text, #3a2a20);
    }
    .setting-desc {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--muted, #9a7b6a);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.active {
      background: var(--primary, #ff8a24);
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.active::after {
      transform: translateX(20px);
    }
    .size-selector {
      display: flex;
      gap: 8px;
    }
    .size-btn {
      padding: 6px 12px;
      border: 1px solid var(--accent, #ffc987);
      border-radius: 8px;
      background: transparent;
      color: var(--text, #3a2a20);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn.active {
      background: var(--primary, #ff8a24);
      border-color: var(--primary, #ff8a24);
      color: white;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--background, #fff7ed);
      border-radius: 50%;
      color: var(--muted, #9a7b6a);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .close-btn:hover {
      background: var(--accent, #ffc987);
      color: var(--text, #3a2a20);
    }
    .achievements {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .achievement {
      background: var(--background, #fff7ed);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.55;
      transition: all 0.2s;
    }
    .achievement.unlocked {
      opacity: 1;
      background: linear-gradient(135deg, var(--accent, #ffc987), var(--primary, #ff8a24));
    }
    .achievement-emoji {
      font-size: 22px;
    }
    .achievement-info {
      flex: 1;
      min-width: 0;
    }
    .achievement-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #3a2a20);
    }
    .achievement-progress {
      font-size: 11px;
      color: var(--muted, #9a7b6a);
      margin-top: 2px;
    }
    .achievement.unlocked .achievement-progress {
      color: #7a4a12;
    }
    .achievement-loading {
      grid-column: 1 / -1;
      color: var(--muted, #9a7b6a);
      font-size: 13px;
      padding: 8px 0;
    }
    .chart-block {
      margin-bottom: 14px;
    }
    .chart-title {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .chart-svg {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      background: var(--background, #fff7ed);
      padding: 6px;
      box-sizing: border-box;
    }
    .diary {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .diary-day {
      background: var(--background, #fff7ed);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .diary-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .diary-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--text, #3a2a20);
    }
    .diary-summary {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
    }
    .diary-detail {
      font-size: 12px;
      color: var(--text, #3a2a20);
      margin-top: 4px;
      opacity: 0.9;
    }
    .custom-hint {
      font-size: 11px;
      color: var(--muted, #9a7b6a);
      margin-bottom: 10px;
    }
    .custom-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .custom-item {
      background: var(--background, #fff7ed);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .custom-item-info {
      flex: 1;
      min-width: 0;
    }
    .custom-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #3a2a20);
    }
    .custom-item-meta {
      font-size: 11px;
      color: var(--muted, #9a7b6a);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .custom-del {
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .custom-del:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.06);
    }
    .custom-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .custom-input, .custom-select {
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      background: var(--background, #fff7ed);
      color: var(--text, #3a2a20);
      outline: none;
      min-width: 0;
      box-sizing: border-box;
      appearance: none;
      -webkit-appearance: none;
    }
    .custom-input:focus, .custom-select:focus {
      border-color: var(--primary, #ff8a24);
    }
    .custom-input.custom-emoji { width: 72px; }
    .custom-input.custom-num { width: 76px; }
    .custom-input.custom-feedback { flex: 1 1 100%; }
    .custom-select { flex: 1 1 160px; background-image: linear-gradient(45deg, transparent 50%, #9a7b6a 50%), linear-gradient(135deg, #9a7b6a 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 12px) 50%; background-size: 4px 4px; background-repeat: no-repeat; padding-right: 26px; }
    .custom-add {
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      background: var(--primary, #ff8a24);
      color: #fff;
      flex-shrink: 0;
    }
    .custom-add:hover { opacity: 0.9; }
    .custom-msg {
      font-size: 11px;
      color: #4c8b5c;
      margin-top: 8px;
      min-height: 14px;
    }
    .custom-msg.error { color: #c0392b; }
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      min-height: 0;
    }
    .content-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .content-scroll::-webkit-scrollbar-thumb {
      background: var(--accent, #ffc987);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="dashboard">
    <div class="card" style="position: relative; flex: 1; display: flex; flex-direction: column;">
      <button class="close-btn" id="close-btn">×</button>
      <div class="content-scroll">
        <div class="header">
          <div class="pet-avatar">🐱</div>
          <div class="pet-info">
            <h2 id="pet-name">桌宠</h2>
            <p id="pet-personality">正在加载角色信息</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">💕 好感度</div>
            <div class="stat-value" id="affection">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">😊 心情</div>
            <div class="stat-value" id="mood">80</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">🎯 今日互动</div>
            <div class="stat-value" id="today-interactions">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">⏰ 陪伴时长</div>
            <div class="stat-value" id="companion-minutes">0<small>分钟</small></div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">✨ 互动</div>
          <div class="interactions" id="interactions-list">
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">📊 数据趋势</div>
          <div class="chart-block">
            <div class="chart-title">💗 好感度（近 14 天累计）</div>
            <div class="chart-svg" id="chart-affection"></div>
          </div>
          <div class="chart-block">
            <div class="chart-title">💬 互动次数（近 14 天）</div>
            <div class="chart-svg" id="chart-interactions"></div>
          </div>
          <div class="chart-block">
            <div class="chart-title">🍅 番茄钟（近 7 天）</div>
            <div class="chart-svg" id="chart-tomato"></div>
          </div>
          <div class="chart-block">
            <div class="chart-title">😊 心情趋势（近 14 天）</div>
            <div class="chart-svg" id="chart-mood"></div>
          </div>
          <div class="chart-block">
            <div class="chart-title">🎭 互动类型分布（近 7 天）</div>
            <div class="chart-svg chart-radar" id="chart-radar"></div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">📖 宠物日记</div>
          <div class="diary" id="diary-list">
            <div class="achievement-loading">正在加载日记…</div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">🏆 成就</div>
          <div class="achievements" id="achievements-list">
            <div class="achievement-loading">正在加载成就…</div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">⏰ 提醒模板</div>
          <div class="reminder-templates">
            <button class="reminder-tpl" data-template="water">💧 喝水</button>
            <button class="reminder-tpl" data-template="nap">😴 午休</button>
            <button class="reminder-tpl" data-template="stretch">🧍 站起来活动</button>
          </div>
          <div class="reminder-list" id="reminder-list"></div>
          <div class="custom-msg" id="reminder-msg"></div>
        </div>

                <div class="settings-group">
          <div class="section-title">🎛 自定义互动</div>
          <div class="custom-hint">在这里直接增删，保存后立即生效（右键菜单 / 快捷键 / 统计同步更新）</div>
          <div class="custom-list" id="custom-list">
            <div class="achievement-loading">正在加载自定义互动…</div>
          </div>
          <div class="custom-form">
            <input class="custom-input" id="custom-label" placeholder="名称，如：比个心" maxlength="24">
            <input class="custom-input custom-emoji" id="custom-emoji" placeholder="emoji" maxlength="8">
            <select class="custom-select" id="custom-state"></select>
            <input class="custom-input custom-num" id="custom-duration" type="number" value="1600" min="300" max="10000" title="持续毫秒">
            <input class="custom-input custom-num" id="custom-gain" type="number" value="1" min="0" max="20" title="好感度加成">
            <input class="custom-input custom-feedback" id="custom-feedback" placeholder="气泡文案，逗号分隔，至少 2 条" maxlength="120">
            <button class="custom-add" id="custom-add-btn">➕ 添加</button>
          </div>
          <div class="custom-msg" id="custom-msg"></div>
        </div>

<div class="settings-group">
          <div class="section-title">⚙️ 设置</div>
          <div class="setting-item">
            <div>
              <div class="setting-label">置顶显示</div>
              <div class="setting-desc">桌宠窗口始终在最前面</div>
            </div>
            <div class="toggle active" id="toggle-always-on-top"></div>
          </div>
          <div class="setting-item">
            <div>
              <div class="setting-label">鼠标穿透</div>
              <div class="setting-desc">点击穿透到后面的窗口</div>
            </div>
            <div class="toggle" id="toggle-click-through"></div>
          </div>
          <div class="setting-item">
            <div>
              <div class="setting-label">桌宠大小</div>
              <div class="setting-desc">调整桌宠显示大小</div>
            </div>
            <div class="size-selector" id="size-selector">
              <button class="size-btn" data-scale="0.65">小</button>
              <button class="size-btn active" data-scale="0.8">标准</button>
              <button class="size-btn" data-scale="1">大</button>
              <button class="size-btn" data-scale="1.2">超大</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
